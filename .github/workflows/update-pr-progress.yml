name: Update PR progress

on:
  push:
    paths:
      - ".github/workflows/update-pr-progress.yml"
      - "scripts/update_pr_progress.py"
  pull_request_target:
    types: [opened, closed, reopened]
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: update-pr-progress
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the update target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.repository.default_branch }}

      - name: Update participant PR counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_pr_progress.py

      - name: Commit the updated README
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update PR progress"
          git push
